[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "proxybridge"
version = "0.1.0"
description = "proxy-bridge v2 —— VM 代理桥（注入层四道防线 + systemd 托管）"
requires-python = ">=3.11"
# 核心运行时零第三方；UI 与人读输出为可选，见 vendor/README.md
dependencies = []

[project.optional-dependencies]
ui = ["customtkinter>=5.2"]
rich = ["rich>=13.9"]
dev = ["pytest>=8.3"]

[project.scripts]
proxy = "proxybridge.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
